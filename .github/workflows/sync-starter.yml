name: Sync to myloop-starter

on:
  push:
      branches:
            - main
              workflow_dispatch:

   jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout myloop-lean
        uses: actions/checkout@v4
 
     - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
 
     - name: Sync clean template to myloop-starter
        env:
          STARTER_REPO_TOKEN: ${{ secrets.STARTER_REPO_TOKEN }}
        run: |
          python3 scripts/sync_starter.py        
